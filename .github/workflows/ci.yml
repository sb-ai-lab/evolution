name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install locked tools
        run: |
          python -m pip install uv==0.10.11
          uv sync --locked --group dev --extra tree --extra llm
      - name: Static checks
        run: |
          uv run --locked --no-sync ruff check src tests scripts
          uv run --locked --no-sync ruff format --check src tests scripts
          uv run --locked --no-sync mypy src/evolution

  product:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.10.11
          uv sync --locked --group dev --extra tree --extra llm
          uv pip install hatchling==1.31.0 pip
      - name: Run complete offline product suite
        run: uv run --locked --no-sync pytest -n 8 --dist worksteal -m "not live and not paper and not external_repo" -q

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install .
      - run: |
          cd "$RUNNER_TEMP"
          evo --version
          python -c "import evolution.workflow"

  artifacts:
    needs: [quality, product, macos-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python311
        with:
          python-version: '3.11'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python314
        with:
          python-version: '3.14'
      - name: Build and verify distributions
        env:
          SOURCE_DATE_EPOCH: '1767225600'
        run: |
          python -m pip install uv==0.10.11
          uv sync --locked --group dev --extra tree --extra llm
          uv run --locked --no-sync python -m build
          uv run --locked --no-sync twine check dist/*
          uv run --locked --no-sync python scripts/check_release_artifacts.py dist/*
      - name: Rehearse the built wheel on Python 3.11
        env:
          REHEARSAL_PYTHON: ${{ steps.python311.outputs.python-path }}
        run: '"$REHEARSAL_PYTHON" scripts/v2_preview_rehearsal.py "$RUNNER_TEMP/wheel-311" --wheel dist/*.whl --python "$REHEARSAL_PYTHON"'
      - name: Rehearse the same wheel on Python 3.14
        env:
          REHEARSAL_PYTHON: ${{ steps.python314.outputs.python-path }}
        run: '"$REHEARSAL_PYTHON" scripts/v2_preview_rehearsal.py "$RUNNER_TEMP/wheel-314" --wheel dist/*.whl --python "$REHEARSAL_PYTHON"'
