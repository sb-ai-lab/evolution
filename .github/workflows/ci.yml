name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  EVOLUTION_TEST_ALLOW_DISK: "1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install locked tools
        run: |
          python -m pip install uv==0.10.11
          uv sync --locked --group dev --extra tree --extra llm
      - name: Static checks
        run: |
          uv run --locked --no-sync ruff check src tests scripts
          uv run --locked --no-sync ruff format --check src tests scripts
          uv run --locked --no-sync mypy src/evolution

  product:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.10.11
          uv sync --locked --group dev --extra tree --extra llm
          uv pip install hatchling==1.31.0 pip
      - name: Run complete offline product suite
        run: uv run --locked --no-sync pytest -n 8 --dist worksteal -m "not live and not paper and not external_repo" -q

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install .
      - run: |
          cd "$RUNNER_TEMP"
          evo --version
          python -c "import evolution.workflow"

  artifacts:
    needs: [quality, product, macos-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python311
        with:
          python-version: '3.11'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python314
        with:
          python-version: '3.14'
      - name: Build and verify distributions
        env:
          SOURCE_DATE_EPOCH: '1767225600'
        run: |
          python -m pip install uv==0.10.11
          uv sync --locked --group dev --extra tree --extra llm
          uv run --locked --no-sync python -m build
          uv run --locked --no-sync twine check dist/*
          uv run --locked --no-sync python scripts/check_release_artifacts.py dist/*
      - name: Rehearse the built wheel on Python 3.11
        env:
          REHEARSAL_PYTHON: ${{ steps.python311.outputs.python-path }}
        run: '"$REHEARSAL_PYTHON" scripts/v2_preview_rehearsal.py "$RUNNER_TEMP/wheel-311" --wheel dist/*.whl --python "$REHEARSAL_PYTHON"'
      - name: Rehearse the same wheel on Python 3.14
        env:
          REHEARSAL_PYTHON: ${{ steps.python314.outputs.python-path }}
        run: '"$REHEARSAL_PYTHON" scripts/v2_preview_rehearsal.py "$RUNNER_TEMP/wheel-314" --wheel dist/*.whl --python "$REHEARSAL_PYTHON"'

  lab:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: lab
    env:
      LAB_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install uv==0.10.11 rust-just==1.59.0 twine==7.0.0
      - name: Verify the panel test runners
        run: |
          node --version
          if [ "$RUNNER_OS" = macOS ]; then
            chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          else
            chrome="$(command -v google-chrome)"
          fi
          "$chrome" --version
          printf 'LAB_PANEL_CHROMIUM="%s"\n' "$chrome" >> "$GITHUB_ENV"
      - name: Build, install and verify the full offline Lab suite
        run: just python="$LAB_PYTHON" test
      - name: Check Lab distribution metadata, public selection and Python syntax
        run: |
          uv build --sdist --out-dir "$RUNNER_TEMP/lab-dist"
          python -m twine check .lab/wheels/evolution_lab-*.whl "$RUNNER_TEMP"/lab-dist/*.tar.gz
          python ../scripts/check_public_lab_snapshot.py .lab/wheels/evolution_lab-*.whl "$RUNNER_TEMP"/lab-dist/*.tar.gz
      - name: Check public references and plugins
        working-directory: .
        run: |
          lab/.lab/venv/bin/python -m pytest -q tests/test_docs_contract.py tests/test_qwen_plugin.py
      - name: Run Lab's offline demos
        run: |
          just python="$LAB_PYTHON" lab guides list
          just python="$LAB_PYTHON" lab scenarios list
          just python="$LAB_PYTHON" demo
          just python="$LAB_PYTHON" demo-campaign
